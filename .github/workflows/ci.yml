name: CI

on:
    pull_request:
    push:
        branches:
            - "main"

permissions:
    contents: read

jobs:
    check:
        name: Check workspace
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: "projects/package.json"

            - name: Read pnpm version
              id: pnpm
              working-directory: projects
              run: |
                  package_manager="$(node -p "require('./package.json').packageManager")"
                  echo "version=${package_manager#pnpm@}" >> "$GITHUB_OUTPUT"

            - name: Set up pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: ${{ steps.pnpm.outputs.version }}
                  run_install: false
                  cache: true
                  cache_dependency_path: projects/pnpm-lock.yaml

            - name: Install dependencies
              working-directory: projects
              run: pnpm install --frozen-lockfile

            - name: Run checks
              working-directory: projects
              run: pnpm check

            - name: Verify generated web routes are committed
              run: git diff --exit-code -- projects/apps/web/src/routeTree.gen.ts

    public-web-e2e:
        name: Public web E2E
        runs-on: ubuntu-latest
        needs: check

        steps:
            - name: Check out repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: "projects/package.json"

            - name: Read pnpm version
              id: pnpm
              working-directory: projects
              run: |
                  package_manager="$(node -p "require('./package.json').packageManager")"
                  echo "version=${package_manager#pnpm@}" >> "$GITHUB_OUTPUT"

            - name: Set up pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: ${{ steps.pnpm.outputs.version }}
                  run_install: false
                  cache: true
                  cache_dependency_path: projects/pnpm-lock.yaml

            - name: Install dependencies
              working-directory: projects
              run: pnpm install --frozen-lockfile

            - name: Install Playwright Chromium
              working-directory: projects
              run: pnpm --filter neonflux-web exec playwright install --with-deps chromium

            - name: Run public web journeys
              working-directory: projects
              run: pnpm test:e2e:web

    authenticated-feature-composition:
        name: Authenticated golden journeys
        runs-on: ubuntu-latest
        needs: check

        steps:
            - name: Check out repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: "projects/package.json"

            - name: Read pnpm version
              id: pnpm
              working-directory: projects
              run: |
                  package_manager="$(node -p "require('./package.json').packageManager")"
                  echo "version=${package_manager#pnpm@}" >> "$GITHUB_OUTPUT"

            - name: Set up pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: ${{ steps.pnpm.outputs.version }}
                  run_install: false
                  cache: true
                  cache_dependency_path: projects/pnpm-lock.yaml

            - name: Install dependencies
              working-directory: projects
              run: pnpm install --frozen-lockfile

            - name: Build runtime packages
              working-directory: projects
              run: pnpm build:runtime-packages

            - name: Run authenticated production-composition journeys
              working-directory: projects
              run: pnpm --filter neonflux-web e2e:authenticated

            - name: Install Chromium for authenticated journeys
              working-directory: projects
              run: pnpm --filter neonflux-web exec playwright install --with-deps chromium

            - name: Run authenticated browser journeys
              working-directory: projects
              run: pnpm --filter neonflux-web e2e:authenticated:browser

    convex-codegen:
        name: Convex codegen drift
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
            CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}
            CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
            NEONFLUX_BOT_AUTH_JWT_AUDIENCE: ${{ vars.NEONFLUX_BOT_AUTH_JWT_AUDIENCE }}
            NEONFLUX_BOT_AUTH_JWT_ISSUER: ${{ vars.NEONFLUX_BOT_AUTH_JWT_ISSUER }}
            NEONFLUX_BOT_AUTH_JWT_JWKS: ${{ vars.NEONFLUX_BOT_AUTH_JWT_JWKS }}
            NEONFLUX_WEB_AUTH_JWT_AUDIENCE: ${{ vars.NEONFLUX_WEB_AUTH_JWT_AUDIENCE }}
            NEONFLUX_WEB_AUTH_JWT_ISSUER: ${{ vars.NEONFLUX_WEB_AUTH_JWT_ISSUER }}
            NEONFLUX_WEB_AUTH_JWT_JWKS: ${{ vars.NEONFLUX_WEB_AUTH_JWT_JWKS }}
            NEONFLUX_USER_AUTH_JWT_AUDIENCE: ${{ vars.NEONFLUX_USER_AUTH_JWT_AUDIENCE }}
            NEONFLUX_USER_AUTH_JWT_ISSUER: ${{ vars.NEONFLUX_USER_AUTH_JWT_ISSUER }}
            NEONFLUX_USER_AUTH_JWT_JWKS: ${{ vars.NEONFLUX_USER_AUTH_JWT_JWKS }}

        steps:
            - name: Check out repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: "projects/package.json"

            - name: Read pnpm version
              id: pnpm
              working-directory: projects
              run: |
                  package_manager="$(node -p "require('./package.json').packageManager")"
                  echo "version=${package_manager#pnpm@}" >> "$GITHUB_OUTPUT"

            - name: Set up pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: ${{ steps.pnpm.outputs.version }}
                  run_install: false
                  cache: true
                  cache_dependency_path: projects/pnpm-lock.yaml

            - name: Install dependencies
              working-directory: projects
              run: pnpm install --frozen-lockfile

            - name: Skip when Convex deployment is not configured
              if: env.CONVEX_DEPLOY_KEY == '' || env.CONVEX_DEPLOYMENT == ''
              run: echo "::notice title=Convex codegen skipped::Set CONVEX_DEPLOY_KEY and CONVEX_DEPLOYMENT to enable generated API drift checks."

            - name: Validate Convex auth variables
              if: env.CONVEX_DEPLOY_KEY != '' && env.CONVEX_DEPLOYMENT != ''
              working-directory: projects
              run: pnpm convex:validate-auth-config

            - name: Run Convex codegen drift check
              if: env.CONVEX_DEPLOY_KEY != '' && env.CONVEX_DEPLOYMENT != ''
              working-directory: projects
              run: pnpm convex:codegen:check
