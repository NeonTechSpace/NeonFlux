name: CI

on:
    pull_request:
    push:
        branches:
            - "main"

permissions:
    contents: read

jobs:
    check:
        name: Check workspace
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: "projects/package.json"

            - name: Read pnpm version
              id: pnpm
              working-directory: projects
              run: |
                  package_manager="$(node -p "require('./package.json').packageManager")"
                  echo "version=${package_manager#pnpm@}" >> "$GITHUB_OUTPUT"

            - name: Set up pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: ${{ steps.pnpm.outputs.version }}
                  run_install: false
                  cache: true
                  cache_dependency_path: projects/pnpm-lock.yaml

            - name: Install dependencies
              working-directory: projects
              run: pnpm install --frozen-lockfile

            - name: Run checks
              working-directory: projects
              run: pnpm check

            - name: Verify generated web routes are committed
              run: git diff --exit-code -- projects/apps/web/src/routeTree.gen.ts

    public-web-e2e:
        name: Public web E2E
        runs-on: ubuntu-latest
        needs: check

        steps:
            - name: Check out repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: "projects/package.json"

            - name: Read pnpm version
              id: pnpm
              working-directory: projects
              run: |
                  package_manager="$(node -p "require('./package.json').packageManager")"
                  echo "version=${package_manager#pnpm@}" >> "$GITHUB_OUTPUT"

            - name: Set up pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: ${{ steps.pnpm.outputs.version }}
                  run_install: false
                  cache: true
                  cache_dependency_path: projects/pnpm-lock.yaml

            - name: Install dependencies
              working-directory: projects
              run: pnpm install --frozen-lockfile

            - name: Install Playwright Chromium
              working-directory: projects
              run: pnpm --filter neonflux-web exec playwright install --with-deps chromium

            - name: Run public web journeys
              working-directory: projects
              run: pnpm test:e2e:web

    authenticated-feature-composition:
        name: Authenticated golden journeys
        runs-on: ubuntu-latest
        needs: check

        steps:
            - name: Check out repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: "projects/package.json"

            - name: Read pnpm version
              id: pnpm
              working-directory: projects
              run: |
                  package_manager="$(node -p "require('./package.json').packageManager")"
                  echo "version=${package_manager#pnpm@}" >> "$GITHUB_OUTPUT"

            - name: Set up pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: ${{ steps.pnpm.outputs.version }}
                  run_install: false
                  cache: true
                  cache_dependency_path: projects/pnpm-lock.yaml

            - name: Install dependencies
              working-directory: projects
              run: pnpm install --frozen-lockfile

            - name: Build runtime packages
              working-directory: projects
              run: pnpm build:runtime-packages

            - name: Install Chromium for authenticated journeys
              working-directory: projects
              run: pnpm --filter neonflux-web exec playwright install --with-deps chromium

            - name: Run Convex drift and authenticated golden journeys
              working-directory: projects
              run: pnpm --filter neonflux-web e2e:authenticated

    production-images:
        name: Production image (${{ matrix.component }})
        runs-on: ubuntu-latest
        needs: check
        strategy:
            fail-fast: false
            matrix:
                component:
                    - bot
                    - web

        steps:
            - name: Check out repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

            - name: Build production image without publishing
              uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
              with:
                  context: ./projects
                  file: ./projects/Dockerfile
                  target: ${{ matrix.component }}
                  load: true
                  push: false
                  provenance: false
                  sbom: false
                  tags: neonflux-${{ matrix.component }}:ci
                  cache-from: type=gha,scope=neonflux-${{ matrix.component }}
                  cache-to: type=gha,scope=neonflux-${{ matrix.component }},mode=max

            - name: Smoke bot runtime package resolution
              if: matrix.component == 'bot'
              run: |
                  docker run --rm --network none --workdir /app/apps/bot --entrypoint node neonflux-bot:ci --input-type=module --eval '
                    const { access } = await import("node:fs/promises");
                    await access("dist/index.js");
                    await Promise.all([
                      import("@neonflux/blueprint"),
                      import("@neonflux/config"),
                      import("@neonflux/convex"),
                      import("@neonflux/core"),
                      import("@neonflux/db"),
                      import("@neonflux/fluxer")
                    ]);
                  '

            - name: Smoke web runtime package resolution
              if: matrix.component == 'web'
              run: |
                  docker run --rm --network none --workdir /app/apps/web --entrypoint node neonflux-web:ci --input-type=module --eval '
                    const { access } = await import("node:fs/promises");
                    await Promise.all([
                      access(".output/server/index.mjs"),
                      access("../../scripts/start-web.mjs"),
                      import("@neonflux/blueprint"),
                      import("@neonflux/config"),
                      import("@neonflux/convex"),
                      import("@neonflux/convex-api"),
                      import("@neonflux/core"),
                      import("@neonflux/db"),
                      import("@neonflux/fluxer"),
                      import("@neonflux/messaging")
                    ]);
                  '
