name: CI

on:
    pull_request:
    push:
        branches:
            - "main"

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: ${{ matrix.name }}
        runs-on: ubuntu-latest
        timeout-minutes: ${{ matrix.timeout }}
        strategy:
            fail-fast: true
            matrix:
                include:
                    - name: Check formatting, unused files, and migration rules
                      task: formatting-rules
                      runtime: node
                      timeout: 10
                    - name: Lint TypeScript and React
                      task: lint
                      runtime: node
                      timeout: 10
                    - name: Type-check and build packages and apps
                      task: typecheck-build
                      runtime: node
                      timeout: 20
                    - name: Run unit tests
                      task: unit-tests
                      runtime: node
                      timeout: 15
                    - name: Public browser tests
                      task: public-browser
                      runtime: node
                      timeout: 15
                    - name: Signed-in feature tests
                      task: signed-in-features
                      runtime: node
                      timeout: 30
                    - name: Blueprint database I/O acceptance
                      task: blueprint-io
                      runtime: node
                      timeout: 30
                    - name: Build and inspect the bot image
                      task: production-image
                      runtime: docker
                      component: bot
                      timeout: 30
                    - name: Build and inspect the web image
                      task: production-image
                      runtime: docker
                      component: web
                      timeout: 30

        steps:
            - name: Check out repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Set up Node.js
              if: matrix.runtime == 'node'
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: "projects/package.json"

            - name: Set CI worker budget
              if: matrix.runtime == 'node'
              shell: bash
              run: |
                  node --input-type=module --eval '
                    import { appendFileSync } from "node:fs";
                    import { availableParallelism } from "node:os";
                    appendFileSync(process.env.GITHUB_ENV, `CI_MAX_WORKERS=${availableParallelism()}\n`);
                  '

            - name: Read pnpm version
              if: matrix.runtime == 'node'
              id: pnpm
              working-directory: projects
              shell: bash
              run: |
                  pnpm_version="$(node -p "require('./package.json').devEngines.packageManager.version")"
                  echo "version=${pnpm_version}" >> "$GITHUB_OUTPUT"

            - name: Set up pnpm
              if: matrix.runtime == 'node'
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: ${{ steps.pnpm.outputs.version }}
                  run_install: false
                  cache: true
                  cache_dependency_path: projects/pnpm-lock.yaml

            - name: Install dependencies
              if: matrix.runtime == 'node'
              working-directory: projects
              run: pnpm install --frozen-lockfile

            - name: Check formatting
              if: matrix.task == 'formatting-rules'
              working-directory: projects
              run: pnpm format:check

            - name: Check migration rules
              if: matrix.task == 'formatting-rules'
              working-directory: projects
              run: pnpm guard:migration-clean

            - name: Find unused files and dependencies
              if: matrix.task == 'formatting-rules'
              working-directory: projects
              run: pnpm knip:ci

            - name: Lint workspace
              if: matrix.task == 'lint'
              working-directory: projects
              run: pnpm lint:ci

            - name: Type-check workspace
              if: matrix.task == 'typecheck-build'
              working-directory: projects
              run: pnpm typecheck:ci

            - name: Build applications
              if: matrix.task == 'typecheck-build'
              working-directory: projects
              run: pnpm build:apps

            - name: Verify generated web routes are committed
              if: matrix.task == 'typecheck-build'
              run: git diff --exit-code -- projects/apps/web/src/routeTree.gen.ts

            - name: Run unit tests
              if: matrix.task == 'unit-tests'
              id: unit-tests
              continue-on-error: true
              working-directory: projects
              run: pnpm test:ci

            - name: Publish unit-test summary
              if: matrix.task == 'unit-tests' && always() && !cancelled()
              working-directory: projects
              run: pnpm test:ci:summary

            - name: Fail when unit tests failed
              if: matrix.task == 'unit-tests' && always() && !cancelled() && steps.unit-tests.outcome != 'success'
              run: |
                  echo "::error title=Unit tests failed::Review the published test summary for failing files."
                  exit 1

            - name: Restore Playwright browser cache
              if: matrix.task == 'public-browser' || matrix.task == 'signed-in-features'
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-chromium-${{ hashFiles('projects/pnpm-lock.yaml') }}

            - name: Install Playwright Chromium
              if: matrix.task == 'public-browser' || matrix.task == 'signed-in-features'
              working-directory: projects
              run: pnpm --filter neonflux-web exec playwright install --with-deps chromium

            - name: Run public browser tests
              if: matrix.task == 'public-browser'
              id: public-browser
              continue-on-error: true
              working-directory: projects
              run: pnpm test:e2e:web

            - name: Publish public browser-test summary
              if: matrix.task == 'public-browser' && always() && !cancelled()
              env:
                  TEST_OUTCOME: ${{ steps.public-browser.outcome }}
              shell: bash
              run: |
                  printf '## Public browser tests\n\nResult: `%s`\n' "$TEST_OUTCOME" >> "$GITHUB_STEP_SUMMARY"

            - name: Upload public browser failure artifacts
              if: matrix.task == 'public-browser' && always() && steps.public-browser.outcome == 'failure'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: public-browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      projects/apps/web/.e2e-runtime/public-playwright-report
                      projects/apps/web/.e2e-runtime/test-results
                  if-no-files-found: warn
                  include-hidden-files: true
                  retention-days: 7

            - name: Fail when public browser tests failed
              if: matrix.task == 'public-browser' && always() && !cancelled() && steps.public-browser.outcome != 'success'
              run: |
                  echo "::error title=Public browser tests failed::Review the summary and uploaded failure artifacts."
                  exit 1

            - name: Build runtime packages for signed-in tests
              if: matrix.task == 'signed-in-features'
              working-directory: projects
              run: pnpm build:runtime-packages

            - name: Run signed-in service and browser tests
              if: matrix.task == 'signed-in-features'
              id: signed-in-features
              continue-on-error: true
              working-directory: projects
              run: pnpm --filter neonflux-web e2e:authenticated

            - name: Publish signed-in feature-test summary
              if: matrix.task == 'signed-in-features' && always() && !cancelled()
              env:
                  TEST_OUTCOME: ${{ steps.signed-in-features.outcome }}
              shell: bash
              run: |
                  printf '## Signed-in feature tests\n\nResult: `%s`\n' "$TEST_OUTCOME" >> "$GITHUB_STEP_SUMMARY"

            - name: Upload signed-in browser failure screenshots
              if: matrix.task == 'signed-in-features' && always() && steps.signed-in-features.outcome == 'failure'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: signed-in-browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
                  path: projects/apps/web/.e2e-runtime/authenticated-test-results/**/*.png
                  if-no-files-found: ignore
                  include-hidden-files: true
                  retention-days: 7

            - name: Fail when signed-in feature tests failed
              if: >-
                  matrix.task == 'signed-in-features' && always() && !cancelled() &&
                  steps.signed-in-features.outcome != 'success'
              run: |
                  echo "::error title=Signed-in feature tests failed::Review the summary and safe screenshot artifacts."
                  exit 1

            - name: Build runtime packages for Blueprint I/O acceptance
              if: matrix.task == 'blueprint-io'
              working-directory: projects
              run: pnpm build:runtime-packages

            - name: Run Blueprint database I/O acceptance
              if: matrix.task == 'blueprint-io'
              working-directory: projects
              run: pnpm blueprint:io-acceptance

            - name: Upload Blueprint database I/O results
              if: matrix.task == 'blueprint-io' && always() && !cancelled()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: blueprint-io-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      projects/apps/web/.e2e-runtime/blueprint-io-acceptance-report.json
                      projects/apps/web/.e2e-runtime/blueprint-io-acceptance.jsonl
                  if-no-files-found: error
                  include-hidden-files: true
                  retention-days: 14

            - name: Set up Docker Buildx
              if: matrix.task == 'production-image'
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            - name: Build production image without publishing
              if: matrix.task == 'production-image'
              id: production-image
              continue-on-error: true
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: ./projects
                  file: ./projects/Dockerfile
                  target: ${{ matrix.component }}
                  load: true
                  push: false
                  provenance: false
                  sbom: false
                  tags: neonflux-${{ matrix.component }}:ci
                  cache-from: type=gha,scope=neonflux-${{ matrix.component }}
                  cache-to: type=gha,scope=neonflux-${{ matrix.component }},mode=max

            - name: Inspect production image runtime
              if: matrix.task == 'production-image' && steps.production-image.outcome == 'success'
              id: production-smoke
              continue-on-error: true
              env:
                  COMPONENT: ${{ matrix.component }}
              shell: bash
              run: |
                  image="neonflux-${COMPONENT}:ci"
                  user="$(docker image inspect --format '{{.Config.User}}' "$image")"
                  if [ "$user" != "node" ]; then
                    echo "Expected the image runtime user to be node, received: ${user:-<empty>}" >&2
                    exit 1
                  fi

                  if [ "$COMPONENT" = "bot" ]; then
                    docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
                      --entrypoint node "$image" --input-type=module --eval '
                        const { access, stat } = await import("node:fs/promises");
                        if (process.getuid() !== 1000 || process.getgid() !== 1000) {
                          throw new Error(`Expected runtime UID/GID 1000:1000, received ${process.getuid()}:${process.getgid()}`);
                        }
                        await access("dist/index.js");
                        const entrypoint = await stat("dist/index.js");
                        if (entrypoint.uid !== 1000 || entrypoint.gid !== 1000) {
                          throw new Error(`Expected bot entrypoint ownership 1000:1000, received ${entrypoint.uid}:${entrypoint.gid}`);
                        }
                        await Promise.all([
                          import("@neonflux/blueprint"),
                          import("@neonflux/config"),
                          import("@neonflux/convex"),
                          import("@neonflux/core"),
                          import("@neonflux/db"),
                          import("@neonflux/fluxer")
                        ]);
                      '
                    exit 0
                  fi

                  container="neonflux-web-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                  trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
                  docker run --detach --name "$container" --network none --read-only \
                    --tmpfs /tmp:rw,noexec,nosuid,size=16m -e HOST=127.0.0.1 -e PORT=3000 "$image" >/dev/null

                  for attempt in $(seq 1 20); do
                    if docker exec "$container" node --input-type=module --eval '
                      const { stat } = await import("node:fs/promises");
                      if (process.getuid() !== 1000 || process.getgid() !== 1000) {
                        throw new Error(`Expected runtime UID/GID 1000:1000, received ${process.getuid()}:${process.getgid()}`);
                      }
                      const entrypoint = await stat(".output/server/index.mjs");
                      if (entrypoint.uid !== 1000 || entrypoint.gid !== 1000) {
                        throw new Error(`Expected web entrypoint ownership 1000:1000, received ${entrypoint.uid}:${entrypoint.gid}`);
                      }
                      const response = await fetch("http://127.0.0.1:3000/");
                      if (response.status >= 500) process.exit(1);
                    '; then
                      exit 0
                    fi

                    if [ "$(docker inspect --format '{{.State.Running}}' "$container")" != "true" ]; then
                      docker logs "$container"
                      exit 1
                    fi
                    sleep 1
                  done

                  docker logs "$container"
                  echo "Web image did not serve its public entrypoint within 20 seconds." >&2
                  exit 1

            - name: Publish production image summary
              if: matrix.task == 'production-image' && always() && !cancelled()
              env:
                  BUILD_OUTCOME: ${{ steps.production-image.outcome }}
                  COMPONENT: ${{ matrix.component }}
                  SMOKE_OUTCOME: ${{ steps.production-smoke.outcome }}
              shell: bash
              run: |
                  image="neonflux-${COMPONENT}:ci"
                  if docker image inspect "$image" >/dev/null 2>&1; then
                    size_bytes="$(docker image inspect --format '{{.Size}}' "$image")"
                    user="$(docker image inspect --format '{{.Config.User}}' "$image")"
                  else
                    size_bytes="unavailable"
                    user="unavailable"
                  fi

                  {
                    printf '## %s production image\n\n' "$COMPONENT"
                    printf -- '- Build: `%s`\n' "$BUILD_OUTCOME"
                    printf -- '- Runtime smoke: `%s`\n' "${SMOKE_OUTCOME:-skipped}"
                    printf -- '- Runtime user: `%s`\n' "$user"
                    printf -- '- Image size: `%s bytes`\n' "$size_bytes"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Fail when production image validation failed
              if: >-
                  matrix.task == 'production-image' && always() && !cancelled() &&
                  (steps.production-image.outcome != 'success' || steps.production-smoke.outcome != 'success')
              run: |
                  echo "::error title=Production image validation failed::Review the build record and production image summary."
                  exit 1
