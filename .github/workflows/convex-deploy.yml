name: Deploy Convex

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: convex-deploy-production
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy Convex functions
        runs-on: ubuntu-latest
        environment: convex-production
        env:
            CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}
            CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
            NEONFLUX_AUTH_JWT_AUDIENCE: ${{ vars.NEONFLUX_AUTH_JWT_AUDIENCE }}
            NEONFLUX_AUTH_JWT_ISSUER: ${{ vars.NEONFLUX_AUTH_JWT_ISSUER }}
            NEONFLUX_AUTH_JWT_JWKS: ${{ vars.NEONFLUX_AUTH_JWT_JWKS }}

        steps:
            - name: Check out repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: "projects/package.json"

            - name: Read pnpm version
              id: pnpm
              working-directory: projects
              run: |
                  package_manager="$(node -p "require('./package.json').packageManager")"
                  echo "version=${package_manager#pnpm@}" >> "$GITHUB_OUTPUT"

            - name: Set up pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: ${{ steps.pnpm.outputs.version }}
                  run_install: false
                  cache: true
                  cache_dependency_path: projects/pnpm-lock.yaml

            - name: Install dependencies
              working-directory: projects
              run: pnpm install --frozen-lockfile

            - name: Validate Convex deploy key
              run: |
                  if [ -z "$CONVEX_DEPLOY_KEY" ]; then
                    echo "::error title=Convex deploy key missing::Set CONVEX_DEPLOY_KEY in the protected convex-production environment."
                    exit 1
                  fi

                  if [ -z "$CONVEX_DEPLOYMENT" ]; then
                    echo "::error title=Convex deployment missing::Set CONVEX_DEPLOYMENT in the protected convex-production environment variables."
                    exit 1
                  fi

            - name: Validate Convex auth config
              working-directory: projects
              run: pnpm convex:validate-auth-config

            - name: Run Convex typecheck
              working-directory: projects
              run: pnpm convex:typecheck

            - name: Deploy Convex functions
              working-directory: projects
              run: pnpm convex:deploy
