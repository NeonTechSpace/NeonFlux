packages:
    - bot
    - backend
    - web
    - site
    - contracts

# Versions every package must share. The bot calls the backend's functions with the same Convex client, and each side decodes
# with the schema values the contracts build, so Convex and Effect stay at one exact version across the workspace. TypeScript
# stays at one version because the Effect typecheck needs an @effect/tsgo release that supports the version every package uses
catalog:
    convex: 1.46.0
    effect: 4.1.0
    typescript: 7.0.2

allowBuilds:
    esbuild@0.27.0: true
    esbuild@0.28.2: true

minimumReleaseAgeExclude:
    - "@neontechspace/fluxerly@1000.0.0-nightly.20261030.41"
    - "@pagefind/darwin-arm64@1.6.0"
    - "@pagefind/darwin-x64@1.6.0"
    - "@pagefind/freebsd-x64@1.6.0"
    - "@pagefind/linux-arm64@1.6.0"
    - "@pagefind/linux-x64@1.6.0"
    - "@pagefind/windows-arm64@1.6.0"
    - "@pagefind/windows-x64@1.6.0"
    - pagefind@1.6.0
