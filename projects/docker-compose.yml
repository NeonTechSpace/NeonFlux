name: neonflux

services:
    bot:
        image: ghcr.io/neontechspace/neonflux-bot:${NEONFLUX_BOT_IMAGE_TAG:-latest}
        build:
            context: .
            dockerfile: Dockerfile
            target: bot
        restart: unless-stopped
        environment:
            APP_ENV: production
            NODE_ENV: production
            CONVEX_DEPLOYMENT: ${CONVEX_DEPLOYMENT:?CONVEX_DEPLOYMENT is required}
            CONVEX_URL: ${CONVEX_URL:?CONVEX_URL is required}
            VITE_CONVEX_URL: ${VITE_CONVEX_URL:?VITE_CONVEX_URL is required}
            NEONFLUX_AUTH_JWT_ISSUER: ${NEONFLUX_AUTH_JWT_ISSUER:?NEONFLUX_AUTH_JWT_ISSUER is required}
            NEONFLUX_AUTH_JWT_AUDIENCE: ${NEONFLUX_AUTH_JWT_AUDIENCE:-neonflux-convex}
            NEONFLUX_AUTH_JWT_JWKS: ${NEONFLUX_AUTH_JWT_JWKS:?NEONFLUX_AUTH_JWT_JWKS is required}
            NEONFLUX_AUTH_JWT_PRIVATE_KEY: ${NEONFLUX_AUTH_JWT_PRIVATE_KEY:?NEONFLUX_AUTH_JWT_PRIVATE_KEY is required}
            INSTANCE_MODE: ${INSTANCE_MODE:-multi}
            SINGLE_GUILD_ID: ${SINGLE_GUILD_ID:-}
            PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
            GUILD_DEFCON_OVERRIDE: ${GUILD_DEFCON_OVERRIDE:-auto}
            FLUXER_BOT_TOKEN: ${FLUXER_BOT_TOKEN:?FLUXER_BOT_TOKEN is required}
            FLUXER_BOT_CUSTOM_STATUS: ${FLUXER_BOT_CUSTOM_STATUS:-}
            LOG_LEVEL: ${LOG_LEVEL:-info}
            OWNER_IDS: ${OWNER_IDS:-}

    web:
        image: ghcr.io/neontechspace/neonflux-web:${NEONFLUX_WEB_IMAGE_TAG:-latest}
        build:
            context: .
            dockerfile: Dockerfile
            target: web
        restart: unless-stopped
        environment:
            APP_ENV: production
            NODE_ENV: production
            CONVEX_DEPLOYMENT: ${CONVEX_DEPLOYMENT:?CONVEX_DEPLOYMENT is required}
            CONVEX_URL: ${CONVEX_URL:?CONVEX_URL is required}
            VITE_CONVEX_URL: ${VITE_CONVEX_URL:?VITE_CONVEX_URL is required}
            NEONFLUX_AUTH_JWT_ISSUER: ${NEONFLUX_AUTH_JWT_ISSUER:?NEONFLUX_AUTH_JWT_ISSUER is required}
            NEONFLUX_AUTH_JWT_AUDIENCE: ${NEONFLUX_AUTH_JWT_AUDIENCE:-neonflux-convex}
            NEONFLUX_AUTH_JWT_JWKS: ${NEONFLUX_AUTH_JWT_JWKS:?NEONFLUX_AUTH_JWT_JWKS is required}
            NEONFLUX_AUTH_JWT_PRIVATE_KEY: ${NEONFLUX_AUTH_JWT_PRIVATE_KEY:?NEONFLUX_AUTH_JWT_PRIVATE_KEY is required}
            FLUXER_APP_ID: ${FLUXER_APP_ID:?FLUXER_APP_ID is required}
            FLUXER_BOT_TOKEN: ${FLUXER_BOT_TOKEN:?FLUXER_BOT_TOKEN is required}
            FLUXER_CLIENT_SECRET: ${FLUXER_CLIENT_SECRET:?FLUXER_CLIENT_SECRET is required}
            FLUXER_OAUTH_REDIRECT_URL: ${FLUXER_OAUTH_REDIRECT_URL:?FLUXER_OAUTH_REDIRECT_URL is required}
            FLUXER_BOT_INVITE_URL: ${FLUXER_BOT_INVITE_URL:-}
            SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
            FLUXER_TOKEN_ENCRYPTION_KEY: ${FLUXER_TOKEN_ENCRYPTION_KEY:?FLUXER_TOKEN_ENCRYPTION_KEY is required}
            GUILD_DEFCON_OVERRIDE: ${GUILD_DEFCON_OVERRIDE:-auto}
            LOG_LEVEL: ${LOG_LEVEL:-info}
            HOST: '0.0.0.0'
            PORT: '3000'
        ports:
            - '${WEB_PORT:-3000}:3000'
